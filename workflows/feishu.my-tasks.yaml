apiVersion: helios/v1
kind: Workflow
id: feishu.my-tasks
version: 1
description: List Feishu tasks assigned to me (requires login)
params:
  query:
    type: string
    required: false
requires:
  clis:
    - name: helios-lark
      version: ">=0.2.0"
steps:
  - id: tasks
    uses: cli
    cli: helios-lark
    sideEffect: read
    argv: ["task", "+get-my-tasks"]
    out: tasks

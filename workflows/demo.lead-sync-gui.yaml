apiVersion: helios/v1
kind: Workflow
id: demo.lead-sync-gui
version: 1
description: Lead sync with optional GUI confirmation when ERP returns needs_gui
params:
  lead_id:
    type: string
    required: true
requires:
  clis:
    - name: demo-crm
      version: ">=1.0.0"
    - name: demo-erp
      version: ">=1.0.0"
steps:
  - id: fetch_lead
    uses: cli
    cli: demo-crm
    sideEffect: read
    argv: ["leads", "get", "--id", "${params.lead_id}", "--output", "json"]
    out: lead

  - id: create_po_dry
    uses: cli
    needs: [fetch_lead]
    cli: demo-erp
    sideEffect: read
    argv: ["po", "create", "--from-json", "${lead.data}", "--dry-run", "--output", "json"]
    out: dry

  - id: approve
    uses: approval
    needs: [create_po_dry]
    prompt: "Create PO for lead ${params.lead_id}?"

  - id: create_po
    uses: cli
    needs: [approve]
    cli: demo-erp
    sideEffect: write
    argv: ["po", "create", "--from-json", "${lead.data}", "--output", "json"]
    out: po

  - id: gui_confirm
    uses: gui
    needs: [create_po]
    when: "${po.data.needs_gui} == true"
    action: screenshot_and_confirm
    sideEffect: write
    gui:
      url: "${po.data.confirmUrl}"
      selector: "button#confirm"
    out: gui_result
